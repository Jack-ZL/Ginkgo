basePath: /
host: localhost:8080
info:
  contact: {}
  description: Ginkgo API 网关的 Swagger 文档。路由由 config.yaml 的 routes 段配置驱动（路径前缀匹配），所有命中路由的请求经中间件链（限流/缓存/日志/认证）后反向代理到负载均衡选出的后端服务。文档
    UI 本身（/swagger/）无需认证。
  title: Ginkgo API Gateway
  version: "1.0"
paths:
  /api/v1/resource:
    get:
      description: 实际生效的路由由 config.yaml 的 routes 段定义（路径前缀匹配）。请求经限流、缓存、认证等中间件后，由负载均衡挑选一个健康后端并透明转发，响应原路返回。响应头
        X-Cache 标识缓存命中（HIT/MISS），X-Request-ID 为链路追踪 ID。
      parameters:
      - description: JWT Token，格式：Bearer <token>（HS256，密钥为 config.yaml 的 jwt.secret）
        in: header
        name: Authorization
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 后端服务返回的响应内容
          schema:
            type: string
        "401":
          description: 未认证：缺失或非法的 JWT Token
          schema:
            type: string
        "429":
          description: 触发限流：超过 rate_limit 次/分钟
          schema:
            type: string
        "502":
          description: 后端不可达或服务地址非法
          schema:
            type: string
        "503":
          description: 无可用后端服务（全部被健康检查摘除）
          schema:
            type: string
      summary: 反向代理后端服务（示例路由 /api/v1/resource）
      tags:
      - proxy
swagger: "2.0"
